<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WHSG-DRA Diagnostic Demo</title>
<style>
:root{
  --bg:#080c18;--card:#10162a;--inner:#0a0f1e;
  --line:#1c2740;--text:#e4eaf6;--muted:#7a8aa5;
  --red:#ef4444;--amber:#f59e0b;--green:#10b981;--blue:#3b82f6;
  --purple:#8b5cf6;
  box-sizing:border-box;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#16224a,transparent 60%),var(--bg);color:var(--text);font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}

.hero{background:linear-gradient(135deg,#3b1e8f 0%,#4a2fc4 40%,#2d4fd4 100%);border-radius:14px;padding:28px 24px;text-align:center;margin-bottom:22px;border:1px solid #5a3dd8;box-shadow:0 8px 32px rgba(80,50,200,.25)}
.hero h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:.01em}
.hero p{margin:0;color:#cfd4f5;font-size:13px}
.hero .sub{margin-top:4px;font-size:12px;color:#a9b0dd}
.badge{display:inline-block;margin-top:12px;background:#10b981;color:#062018;font-weight:800;font-size:11px;padding:4px 12px;border-radius:99px;letter-spacing:.06em}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:800;color:var(--purple);letter-spacing:.02em;font-family:ui-monospace,"Consolas",monospace}
.card .hint{margin:0 0 14px;color:var(--muted);font-size:12.5px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:700 13px ui-sans-serif,system-ui;color:var(--text);background:#1a2340;border:1px solid #2a3760;border-radius:8px;padding:9px 14px;cursor:pointer;transition:.15s}
button:hover{background:#22305a;border-color:#3a4a80}
button.on{background:linear-gradient(135deg,#6d4aff,#4a3fd8);border-color:#8b5cf6;color:#fff}
button.primary{background:linear-gradient(135deg,#8b5cf6,#6d4aff);border-color:#a78bfa;color:#fff}
button.primary:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--inner);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.kpi b{font-size:24px;font-weight:800}
.kpi b.red{color:var(--red)}.kpi b.green{color:var(--green)}.kpi b.amber{color:var(--amber)}

.esbar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:12px 0 14px;border:1px solid var(--line);font-size:11px;font-weight:800;color:#fff}
.esbar div{display:grid;place-items:center;transition:flex-basis .4s ease}
.esbar .ef{background:var(--red)}.esbar .ep{background:var(--amber)}.esbar .ec{background:var(--purple)}.esbar .eu{background:#374151}
.eslegend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.eslegend span b{color:var(--text);font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.f{background:var(--red)}.dot.p{background:var(--amber)}.dot.c{background:var(--purple)}
.dominant{margin-top:12px;font-weight:800;color:var(--text)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #131b30}
tbody tr:hover{background:#0e1730}
td.mono{font-family:ui-monospace,"Consolas",monospace;color:#b7c4e0}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px}
.p-ok{background:rgba(16,185,129,.18);color:#34d399;border:1px solid #10b981}
.p-mid{background:rgba(245,158,11,.18);color:#fbbf24;border:1px solid #f59e0b}
.p-hi{background:rgba(239,68,68,.18);color:#f87171;border:1px solid #ef4444}

.rc{background:var(--inner);border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.rc .rank{font-size:11px;font-weight:800;color:var(--purple);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.rc .title{font-weight:800;font-size:14px;margin-bottom:2px}
.rc .title .arrow{color:var(--muted);font-weight:400;margin:0 6px}
.rc .note{font-size:12px;color:var(--muted);margin-top:4px}

.rec{background:var(--inner);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.rec .prio{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.rec .rtitle{font-weight:800;font-size:14px;margin-bottom:3px}
.rec .rid{font-family:ui-monospace,"Consolas",monospace;font-size:12px;color:var(--muted)}
.rec .rid em{font-style:normal;color:#5b6a8a;margin:0 4px}

pre.brief{background:var(--inner);border:1px dashed #2e3d68;border-radius:8px;padding:16px;font:12.5px/1.7 ui-monospace,"Consolas",monospace;color:#c9d4ec;white-space:pre-wrap;word-break:break-word;margin:0;max-height:520px;overflow-y:auto}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.loading{color:var(--purple);font-weight:700}

/* Sensitivity highlight */
.delta-pos{color:#34d399; font-weight:800}
.delta-neg{color:#f87171; font-weight:800}
</style>
</head>
<body>
<main>
<div class="hero">
  <h1>WHSG-DRA Diagnostic Demo</h1>
  <p>Weighted Hierarchical Skill-Graph Diagnostic and Recommendation Algorithm</p>
  <div class="sub">Mathematics in the Modern World · Pambayang Dalubhasaan ng Marilao</div>
  <div class="badge">Research Demo Prototype</div>
</div>

<section class="card">
  <h2>| Step 1: Select Student</h2>
  <div class="row" id="studentRow"><span class="loading">Loading students…</span></div>
  <div class="row" style="margin-top:14px">
    <button class="primary" id="runBtn" disabled>▶ Run WHSG-DRA Diagnostic</button>
    <button id="sensBtn" disabled>📊 Sensitivity Analysis</button>
    <button id="resetBtn">↺ Reset</button>
  </div>
</section>

<div id="output"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let STUDENTS = [], PICKED = null, R = null, SENS = null;

const bandCls = b => b === 'Mastered' ? 'p-ok' : b === 'Developing' ? 'p-mid' : 'p-hi';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

function renderStudents() {
  $('studentRow').innerHTML = STUDENTS.map(s =>
    `<button data-sid="${s.id}" class="${PICKED === s.id ? 'on' : ''}">👤 ${esc(s.name)}</button>`
  ).join('') + `<button data-sid="__rand" class="">🎲 Random Student</button>`;
  $('runBtn').disabled = !PICKED;
  $('sensBtn').disabled = !PICKED;
  $('studentRow').querySelectorAll('[data-sid]').forEach(b => b.onclick = () => {
    const v = b.dataset.sid;
    PICKED = v === '__rand' ? STUDENTS[Math.floor(Math.random() * STUDENTS.length)].id : v;
    renderStudents();
  });
}

function renderOverall(o) {
  const pct = o.total_pct, cp = o.course_proficiency ?? 0;
  return `<section class="card">
    <h2>| Step 2: Overall Result</h2>
    <div class="kpis">
      <div class="kpi"><small>Total Score</small><b>${o.total_score}/${o.total_administered} (${pct}%)</b></div>
      <div class="kpi"><small>Course Proficiency</small><b class="${cp >= 80 ? 'green' : cp >= 60 ? 'amber' : 'red'}">${cp}%</b></div>
      <div class="kpi"><small>Skills Assessed</small><b>${o.skills_assessed}</b></div>
      <div class="kpi"><small>Skills Needing Review</small><b class="red">${o.needs_review}</b></div>
    </div>
  </section>`;
}

function renderErrorSource(e) {
  const c = e.counts, p = e.pct;
  const total = c.F + c.P + c.C + c.U || 1;
  const fw = c.F / total * 100, pw = c.P / total * 100, cw = c.C / total * 100, uw = c.U / total * 100;
  return `<section class="card">
    <h2>| Step 3: Error-Source Estimation</h2>
    <p class="hint">Each wrong answer is classified into one of three error dimensions:</p>
    <div class="esbar">
      ${fw > 0 ? `<div class="ef" style="flex-basis:${fw}%">${p.F}%</div>` : ''}
      ${pw > 0 ? `<div class="ep" style="flex-basis:${pw}%">${p.P}%</div>` : ''}
      ${cw > 0 ? `<div class="ec" style="flex-basis:${cw}%">${p.C}%</div>` : ''}
      ${uw > 0 ? `<div class="eu" style="flex-basis:${uw}%">${p.U}%</div>` : ''}
    </div>
    <div class="eslegend">
      <span><i class="dot f"></i>Arithmetic (F) — w=0.30 <b>${c.F}</b></span>
      <span><i class="dot p"></i>Procedural (P) — w=0.40 <b>${c.P}</b></span>
      <span><i class="dot c"></i>Conceptual (C) — w=0.30 <b>${c.C}</b></span>
    </div>
    <div class="dominant">Dominant Error: ${esc((e.dominant_label || '—').toUpperCase())} (${c[e.dominant] || 0} errors)</div>
    <p class="hint" style="margin-top:6px">The student's errors are not random — they cluster around a specific pattern.</p>
  </section>`;
}

function renderSkills(rows) {
  return `<section class="card">
    <h2>| Step 4: Skill-Level Proficiency</h2>
    <table><thead><tr><th>Skill ID</th><th>Description</th><th>P_s</th><th>Band</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td class="mono">${r.code}</td><td>${esc(r.skill)}</td><td class="mono">${r.P.toFixed(1)}%</td><td><span class="pill ${bandCls(r.band)}">${r.band}</span></td></tr>`).join('')}</tbody></table>
  </section>`;
}

function renderModules(rows) {
  return `<section class="card">
    <h2>| Step 5: Module Roll-Up</h2>
    <table><thead><tr><th>Module</th><th>Skills</th><th>Avg Proficiency</th><th>Band</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>Module ${r.module + 1}: ${esc(r.name)}</td><td class="mono">${r.skills}</td><td class="mono">${r.avg.toFixed(1)}%</td><td><span class="pill ${bandCls(r.band)}">${r.band}</span></td></tr>`).join('')}</tbody></table>
  </section>`;
}

function renderRoot(rows) {
  return `<section class="card">
    <h2>| Step 6: Root-Cause Ranking</h2>
    <p class="hint">Prerequisite influence: weaknesses in prerequisite skills that propagate to dependent skills.</p>
    ${rows.length === 0 ? '<p class="empty">No prerequisite weaknesses detected.</p>' : rows.map((r, i) => `
        <div class="rc">
          <div class="rank">Rank ${i + 1} — Influence Score: ${r.rank_score}</div>
          <div class="title">${esc(r.skill)} (${r.P}%)${r.dependent ? `<span class="arrow">→ affects →</span>${esc(r.dependent)} (${r.dependent_P}%)` : ''}</div>
          <div class="note">${esc(r.note)}</div>
        </div>`).join('')}
  </section>`;
}

function renderRecs(rows) {
  return `<section class="card">
    <h2>| Step 7: Ranked Recommendations</h2>
    ${rows.length === 0 ? '<p class="empty">No recommendations — proficiency is high enough.</p>' : rows.map((r, i) => `
        <div class="rec">
          <div class="prio">Priority ${i + 1} — Relevance: ${r.relevance}%</div>
          <div class="rtitle">${esc(r.title)} <span style="color:var(--muted);font-weight:400">(${esc(r.kind)})</span></div>
          <div class="rid">ID: ${esc(r.id)}<em>·</em>Covers: ${r.covers.join(', ')}</div>
        </div>`).join('')}
  </section>`;
}

function renderBrief(brief) {
  return `<section class="card"><h2>| Step 8: Peer Tutor Brief</h2><pre class="brief">${esc(brief)}</pre></section>`;
}

function renderSensitivity(SENS) {
  if (!SENS || !SENS.has_data) return `<section class="card"><h2>| Sensitivity Analysis</h2><p class="empty">No assessment data available to analyze yet.</p></section>`;
  const rows = SENS.skills.map(r => {
    const dEq = r.delta_equal > 0 ? `<span class="delta-pos">+${r.delta_equal}</span>` : r.delta_equal < 0 ? `<span class="delta-neg">${r.delta_equal}</span>` : '—';
    const dFh = r.delta_f_heavy > 0 ? `<span class="delta-pos">+${r.delta_f_heavy}</span>` : r.delta_f_heavy < 0 ? `<span class="delta-neg">${r.delta_f_heavy}</span>` : '—';
    return `<tr>
      <td>${esc(r.skill)}</td>
      <td class="mono">${r.default}%</td>
      <td class="mono">${r.equal}%</td>
      <td class="mono">${dEq}</td>
      <td class="mono">${r.f_heavy}%</td>
      <td class="mono">${dFh}</td>
    </tr>`;
  }).join('');
  return `<section class="card">
    <h2>| Sensitivity Analysis</h2>
    <p class="hint">Compares the standard WHSG-DRA weights (F=0.30, P=0.40, C=0.30) against equal weights (0.33 each) and F-heavy weights (F=0.60, P=0.20, C=0.20). A large delta means the student's proficiency is highly sensitive to the category weighting.</p>
    <table>
      <thead><tr><th>Skill</th><th>Default %</th><th>Equal %</th><th>Δ Equal</th><th>F-Heavy %</th><th>Δ F-Heavy</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>`;
}

function renderReport(R, SENS) {
  $('output').innerHTML = renderOverall(R.overall) + renderErrorSource(R.error_source) + renderSkills(R.skills) + renderModules(R.modules) + renderRoot(R.root_cause) + renderRecs(R.recommendations) + renderBrief(R.brief) + (SENS ? renderSensitivity(SENS) : '');
}

async function run() {
  if (!PICKED) return;
  $('runBtn').disabled = true;
  $('output').innerHTML = '<div class="card"><span class="loading">Running WHSG-DRA…</span></div>';
  try {
    R = await api('POST', '/api/demo/diagnostic', {student_id: PICKED});
    SENS = null;
    renderReport(R, SENS);
  } catch (e) {
    $('output').innerHTML = `<div class="card"><span style="color:var(--red)">Error: ${esc(e.message)}</span></div>`;
  } finally {
    $('runBtn').disabled = false;
  }
}

async function runSens() {
  if (!PICKED) return;
  if (!R) { await run(); }
  $('sensBtn').disabled = true;
  try {
    SENS = await api('POST', '/api/demo/sensitivity', {student_id: PICKED});
    if (R) renderReport(R, SENS);
  } catch (e) {
    $('output').innerHTML += `<div class="card"><span style="color:var(--red)">Error: ${esc(e.message)}</span></div>`;
  } finally {
    $('sensBtn').disabled = false;
  }
}

$('runBtn').onclick = run;
$('sensBtn').onclick = runSens;
$('resetBtn').onclick = () => { PICKED = null; R = null; SENS = null; $('output').innerHTML = ''; renderStudents(); };

(async () => {
  try {
    STUDENTS = await api('GET', '/api/demo/students');
    renderStudents();
  } catch (e) {
    $('studentRow').innerHTML = `<span style="color:var(--red)">Error: ${esc(e.message)}</span>`;
  }
})();
</script>
</body>
</html>
